{% extends "base.html" %}
{% block title %}Replicar item{% endblock %}
{% block content %}
  <div class="month-header">
    <a class="back-link" href="{{ url_for('month_view', year=item.year, month=item.month) }}">&#8592; Voltar</a>
    <h1>Replicar "{{ item.name }}"</h1>
  </div>

  <div class="add-form-card">
    <p class="hint">
      Cria uma cópia independente desta conta ({{ origin_month_name }} de {{ item.year }},
      {{ item.amount | brl }}) em outro mês. Editar uma não altera a outra.
    </p>
    <form method="post" class="add-form">
      <div class="form-row">
        <label for="target_month">Mês de destino</label>
        <select id="target_month" name="target_month">
          {% for m, name in month_options %}
            <option value="{{ m }}" {{ 'selected' if m == item.month else '' }}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="target_year">Ano de destino</label>
        <input type="number" id="target_year" name="target_year" value="{{ item.year }}">
      </div>
      <button type="submit" class="btn btn-primary">Replicar</button>
    </form>
  </div>
{% endblock %}
